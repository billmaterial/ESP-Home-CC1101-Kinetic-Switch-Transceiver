substitutions:
  name: # Change to your device name
  friendly_name: Kinetic Switch Reciever

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: dev

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    component: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: #Add your API key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
#  power_save_mode: none
  fast_connect: off
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: # Change to your ap name
    password: # Change to your ap password 

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp32.yaml@main
  import_full_config: true

# To have a "next url" for improv serial
web_server:
  ota: false
  
###############################################################################################
# CC1101 Setup
external_components:
    - source: custom_components # My Modified Version for 30Kbps for Kinetic Switches

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  id: transceiver
  cs_pin: GPIO5
  bandwidth: 200
  frequency: 433920
  
  rssi:
    name: "${friendly_name} rssi"
  lqi:
    name: "${friendly_name} lqi"

# 433MHz Receiver
remote_receiver:
  - id: receiver
    pin:
      number: 22 # This is GDO2
    tolerance: 50%  #25% default, tune to get working
    filter: 10us    #50us default, tune to get working
    idle: 10ms      #10ms default, tune to get working
    dump:
    #  - rc_switch
    #  - raw

# 433MHz Transmitter
remote_transmitter:
  - id: transmitter
    pin:
      number: 4 # This is GDO0
    carrier_duty_percent: 100%
    on_transmit:
      then:
        - cc1101.begin_tx: transceiver
    on_complete:
      then:
        - cc1101.end_tx: transceiver
###############################################################################################
#Sensors
sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: "diagnostic"

  - platform: internal_temperature
    name: "Internal Temperature"
    id: esp_temperature
    update_interval: 10s
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
    ssid:
      name: ESP Connected SSID
      id: esp_connected_ssid
    bssid:
      name: ESP Connected BSSID
    mac_address:
      name: ESP Mac Wifi Address
    scan_results:
      name: ESP Latest Scan Results

# Status Light entry
light:
  - platform: status_led
    name: "Switch state"
    id: switch_state
    pin: 
      number: 2
      mode: OUTPUT

